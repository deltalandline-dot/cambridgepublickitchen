<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search by ingredient — Public Kitchen Cookbook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<p><a href="index.html">All recipes</a></p>
<h1>Search by ingredient</h1>
<p class="hint">Type one or more ingredients, separated by commas (e.g. <em>lentil, garlic, ginger</em>). Recipes matching more ingredients are listed first.</p>
<div class="search-wrap">
<input type="search" id="query" placeholder="lentil, garlic, ginger…" autocomplete="off">
<ul id="suggestions"></ul>
</div>
<p id="status" class="hint"></p>
<ul id="results"></ul>
<script src="search.js"></script>
</body>
</html>
