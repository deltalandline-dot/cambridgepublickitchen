<p class="source">Source: <a href="https://www.insightretreatcenter.org/recipes/">Insight Retreat Center</a></p>
<div id="scale-box" class="hint">Scale recipe: <button type="button" data-mult="0.5">½×</button> <button type="button" data-mult="1" class="active">1×</button> <button type="button" data-mult="2">2×</button> <button type="button" data-mult="3">3×</button> or <input type="number" id="scale-custom" min="0.1" step="0.5" placeholder="custom">×</div>
<p>Adapted from Martha Stewart on the web.</p>
<p>Yield: ~4 cups</p>
<p>Ingredients</p>
<ul>
  <li><label><input type="checkbox"> 1 pound sweet potatoes, peeled and cut into 1-inch pieces (if starting from leftover baked ones: just peel and mash, try about 2 cups)</label></li>
  <li><label><input type="checkbox"> 1 can (19.5 ounces) chickpeas, drained and rinsed</label></li>
  <li><label><input type="checkbox"> 1/4 cup fresh lemon juice (from 1 lemon)</label></li>
  <li><label><input type="checkbox"> 1/4 cup tahini</label></li>
  <li><label><input type="checkbox"> 2 tablespoons olive oil</label></li>
  <li><label><input type="checkbox"> 2 teaspoons ground cumin</label></li>
  <li><label><input type="checkbox"> 1 garlic clove, chopped</label></li>
  <li><label><input type="checkbox"> Coarse salt and ground pepper</label></li>
  <li><label><input type="checkbox"> Whole-wheat pita and crudites such as red pepper and broccoli, for serving</label></li>
</ul>
