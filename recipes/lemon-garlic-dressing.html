<h1>Lemon-garlic dressing</h1>
<p class="tags">Tags: Vegan, Gluten-Free, Dairy-Free, Nut-Free, Soy-Free</p>
<p class="source">Source: <a href="https://www.insightretreatcenter.org/recipes/">Insight Retreat Center</a></p>
<div id="scale-box" class="hint">Scale recipe: <button type="button" data-mult="0.5">½×</button> <button type="button" data-mult="1" class="active">1×</button> <button type="button" data-mult="2">2×</button> <button type="button" data-mult="3">3×</button> or <input type="number" id="scale-custom" min="0.1" step="0.5" placeholder="custom">×</div>
<p>Yield: 12 servings</p>
<p>Ingredients</p>
<ul>
  <li><label><input type="checkbox"> 2 garlic cloves</label></li>
  <li><label><input type="checkbox"> 1.5 t. salt</label></li>
  <li><label><input type="checkbox"> 6 T. fresh lemon juice</label></li>
  <li><label><input type="checkbox"> 3 T. white wine vinegar (or orange muscat vinegar, if white wine vinegar isn't on hand)</label></li>
  <li><label><input type="checkbox"> ¾ t. lemon zest</label></li>
  <li><label><input type="checkbox"> Ground black pepper to taste</label></li>
  <li><label><input type="checkbox"> 1-1/8 c. extra-virgin olive oil (EVOO)</label></li>
</ul>
