<h1>Cashew Dressing</h1>
<p class="tags">Tags: Vegan, Gluten-Free, Dairy-Free, Soy-Free</p>
<p class="source">Source: <a href="https://www.insightretreatcenter.org/recipes/">Insight Retreat Center</a></p>
<div id="scale-box" class="hint">Scale recipe: <button type="button" data-mult="0.5">½×</button> <button type="button" data-mult="1" class="active">1×</button> <button type="button" data-mult="2">2×</button> <button type="button" data-mult="3">3×</button> or <input type="number" id="scale-custom" min="0.1" step="0.5" placeholder="custom">×</div>
<p>Ingredients</p>
<ul>
  <li><label><input type="checkbox"> 4 cups raw cashews</label></li>
  <li><label><input type="checkbox"> 2 1/4 cups vegetable oil</label></li>
  <li><label><input type="checkbox"> 3/4 cup cider vinegar</label></li>
  <li><label><input type="checkbox"> 3 cups water</label></li>
  <li><label><input type="checkbox"> 2 cloves garlic</label></li>
  <li><label><input type="checkbox"> 1 1/2 Tbs salt</label></li>
  <li><label><input type="checkbox"> 1 1/2 Tbs dill, fresh or dried</label></li>
  <li><label><input type="checkbox"> 2 1/2 Tbs parsley leaves, chopped</label></li>
  <li><label><input type="checkbox"> 1 1/2 Tbs oregano</label></li>
  <li><label><input type="checkbox"> 1 tsp rosemary, fresh chopped</label></li>
  <li><label><input type="checkbox"> 1 tsp pepper</label></li>
</ul>
<p>Preparation</p>
<ol>
  <li>Blend all ingredients in large blender.</li>
  <li>Adjust water to reach correct consistency.</li>
</ol>
<script src="../calculator.js" defer></script>
